name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          printf 'A\u200bB\n' > /tmp/sample.txt
          textunmark inspect /tmp/sample.txt
          textunmark sanitize /tmp/sample.txt -o /tmp/clean.txt
          textunmark compare /tmp/sample.txt /tmp/clean.txt
