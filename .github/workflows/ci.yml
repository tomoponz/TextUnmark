name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q src
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke tests
        run: |
          set -eu
          mkdir -p /tmp/textunmark-tree/docs
          printf 'A\u200bB\n' > /tmp/textunmark-tree/sample.txt
          printf 'hello\u00a0world\n' > /tmp/textunmark-tree/docs/readme.md
          textunmark --version
          textunmark doctor
          textunmark detectors
          textunmark inspect /tmp/textunmark-tree/sample.txt
          textunmark sanitize /tmp/textunmark-tree/sample.txt -o /tmp/clean.txt
          textunmark compare /tmp/textunmark-tree/sample.txt /tmp/clean.txt
          textunmark detect /tmp/textunmark-tree/sample.txt --json > /tmp/detect.json
          textunmark analyze /tmp/textunmark-tree/sample.txt --json > /tmp/analyze.json
          textunmark batch /tmp/textunmark-tree --dry-run --json > /tmp/batch.json
          textunmark scan /tmp/textunmark-tree -o /tmp/results.sarif
          textunmark report /tmp/textunmark-tree/sample.txt -o /tmp/report.html
          test -s /tmp/results.sarif
          test -s /tmp/report.html
      - name: Validate browser modules
        run: |
          node --check web/engine.mjs
          node --check web/worker.mjs
          node --check web/app.mjs
      - name: Run browser engine tests
        run: node --test web/engine.test.mjs
